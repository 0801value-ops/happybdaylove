name: Deploy happybdaylove
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the website
        run: unzip -q nirvana-final-fotos-actualizadas.zip -d site
      - name: Adapt paths for GitHub Pages
        run: |
          find site -type f -name '*.html' -print0 | xargs -0 sed -i 's#="/#="/happybdaylove/#g'
          find site/__local/intro -type f -name '*.js' -print0 | xargs -0 sed -i 's#"/#"/happybdaylove/#g'
          find site/assets -type f -name '*.js' -print0 | xargs -0 sed -i -e 's#src:"/#src:"/happybdaylove/#g' -e 's#href:"/#href:"/happybdaylove/#g'
          sed -i 's#a.jsx(X5,{children:#a.jsx(X5,{basename:"/happybdaylove",children:#' site/assets/index-Bf1YA9eZ.js
          find site -type f -name '*.css' -print0 | xargs -0 sed -i 's#url("/#url("/happybdaylove/#g'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4
